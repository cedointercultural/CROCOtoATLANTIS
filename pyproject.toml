[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "croco2atlantis"
version = "0.0.1"
description = "Convert CROCO ocean model output into ATLANTIS hydrographic forcing files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ricardo Cavieses" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "xarray",
    "netCDF4",
    "scipy",
    "pandas",
    "shapely",
    "geopandas",
    "pyproj",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
croco2atlantis = "croco2atlantis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
